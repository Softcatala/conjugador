services:
  conjugador-elastic:
    image: conjugador-elasticsearch
    build:
      context: .
      dockerfile: ./docker/elasticsearch/Dockerfile
    ports:
      - "9200:9200"

    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -fs http://localhost:9200/_cluster/health \
          | grep -E '"status":"(green|yellow)"' \
          || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  conjugador-server:
    image: conjugador-webserver
    build:
      context: .
      dockerfile: ./docker/webserver/Dockerfile
    environment:
      ES_URL: "http://conjugador-elastic:9200"
      OTEL_SERVICE_NAME: "conjugador-server"
    ports:
      - "8000:8000"
    depends_on:
      conjugador-elastic:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - |
          curl -fs http://localhost:8000/index/a \
          || exit 1
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    depends_on:
      conjugador-server:
        condition: service_healthy
